# =====================================================================
#  PRODUCTION stack — single droplet, cheapest setup.
#
#  Services: Postgres (+volume) · Redis · backend · frontend · Caddy
#  (auto-HTTPS reverse proxy) · nightly Postgres backup.
#
#  Redis is NOT published to the host — it is only reachable on the
#  internal compose network. Postgres is published to the droplet's
#  LOOPBACK only (127.0.0.1:5432) so a DBA can reach it through an SSH
#  tunnel; it stays invisible to the internet. Only Caddy exposes
#  ports (80/443) to the internet.
#
#  Secret hygiene: only the BACKEND needs the secret-bearing env files
#  (.env.production[.local]). The frontend receives just the handful of
#  non-secret runtime vars it actually reads, so a frontend compromise
#  can never leak the bot token, Google secret, or DB password.
#
#  Resource limits: sized for 2 vCPU / 4 GB RAM droplet.
#    Budget (leaves ~512 MB host headroom):
#      postgres   768m  / 1.0 CPU
#      redis      384m  / 0.5 CPU
#      backend   1280m  / 1.5 CPU
#      frontend   768m  / 1.5 CPU
#      caddy      128m  / 0.5 CPU
#      db-backup  192m  / 0.5 CPU
#    memswap_limit == mem_limit: disables per-container swap so a memory
#    leak fails fast instead of thrashing the shared box.
#
#  Deploy (on the server):
#    docker compose \
#      --env-file .env.production \
#      --env-file .env.production.local \
#      -f docker-compose.prod.yml up -d
#
#  Images default to GHCR tags but can be built locally with:
#    docker compose -f docker-compose.prod.yml build
# =====================================================================
name: stickup-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Tuned for 4 GB droplet: shared_buffers ~25 % of Postgres mem budget,
    # effective_cache_size ~75 %, work_mem modest, max_connections capped so
    # Prisma's connection_limit=10 leaves ample headroom.
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=8MB
        -c maintenance_work_mem=128MB
        -c max_connections=50
    mem_limit: 768m
    memswap_limit: 768m
    cpus: '1.0'
    # Bind to the droplet's loopback ONLY (never 0.0.0.0): reachable from
    # an on-droplet SSH tunnel (e.g. DataGrip) but not from the internet.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - stickup-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ backing store: noeviction so queued jobs are never silently
    # dropped; persistence off (RDB/AOF) because jobs are ephemeral and
    # throughput is low. maxmemory cap kept well under container mem_limit.
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --save ""
        --appendonly no
    mem_limit: 384m
    memswap_limit: 384m
    cpus: '0.5'
    volumes:
      - stickup-prod-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/garikmartikyan/stikup-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: '1.5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The backend legitimately needs the full secret set.
    env_file:
      - .env.production
      - path: .env.production.local
        required: false
    environment:
      # Reach Postgres/Redis over the compose network (override any host value).
      # connection_limit=10: Prisma pool stays well under postgres max_connections=50.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      REDIS_URL: redis://redis:6379
      # Stable in-container path; matches the named volume mount below.
      STICKER_STORAGE_DIR: /app/backend/public/packs
      # Cap V8 old-gen below the 1280m container limit; leaves ~384m for the
      # Python subprocess that splits sticker grids.
      NODE_OPTIONS: --max-old-space-size=896
    volumes:
      - stickup-prod-stickers:/app/backend/public/packs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3131/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/garikmartikyan/stikup-frontend:latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked at build time: server-side origin + client-visible bot URL + ad block id.
        BACKEND_URL: http://backend:3131
        NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL}
        NEXT_PUBLIC_ADSGRAM_BLOCK_ID: ${NEXT_PUBLIC_ADSGRAM_BLOCK_ID:-}
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    cpus: '1.5'
    depends_on:
      backend:
        condition: service_healthy
    # NO env_file here — the frontend must not receive backend secrets.
    # Only the non-secret vars it reads at runtime are passed explicitly.
    environment:
      NODE_ENV: production
      # Server-side SSR/rewrites talk to the backend over the compose network.
      BACKEND_URL: http://backend:3131
      # Name of the session cookie the frontend looks for (non-secret).
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sid}
      # Cap V8 old-gen below the 768m container limit.
      NODE_OPTIONS: --max-old-space-size=512
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: '0.5'
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Nightly dump; keep a rolling window of daily/weekly/monthly backups.
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: '7'
      BACKUP_KEEP_WEEKS: '4'
      BACKUP_KEEP_MONTHS: '6'
      HEALTHCHECK_PORT: '8080'
    volumes:
      - ./backups:/backups

volumes:
  stickup-prod-postgres:
  stickup-prod-redis:
  stickup-prod-stickers:
  caddy-data:
  caddy-config:
